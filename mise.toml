[tools]
github-cli = "2.99.0"
go = "1.27.1"
gradle = "9.5.0"
java = "25.0.2"

[tasks.phase0-check]
description = "Run the Phase 0 cross-platform contract baseline"
run = [
  "gradle -p spikes/o-001/kmp jvmTest --no-daemon",
  "swift run --package-path spikes/o-001/native-schema NativeSchemaSpikeChecker spikes/o-001/fixtures",
]

[tasks.phase2-check]
description = "Run the native Host distribution and companion verification gate"
run = [
  "test -z \"$(gofmt -l cmd internal protocol test)\"",
  "go vet ./...",
  "go test ./...",
  "go test -race ./...",
  "mkdir -p build/lumen-host",
  "go build -trimpath -ldflags='-s -w' -o build/lumen-host/lumen-host ./cmd/lumen-host",
  "go build -trimpath -ldflags='-s -w' -o build/lumen-host/lumen-host.second ./cmd/lumen-host",
  "GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o build/lumen-host/lumen-host-linux-arm64 ./cmd/lumen-host",
  "GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o build/lumen-host/lumen-host-android-arm64 ./cmd/lumen-host",
  "GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o build/lumen-host/lumen-host-linux-arm64.second ./cmd/lumen-host",
  "test \"$(shasum -a 256 build/lumen-host/lumen-host | cut -d' ' -f1)\" = \"$(shasum -a 256 build/lumen-host/lumen-host.second | cut -d' ' -f1)\"",
  "test \"$(shasum -a 256 build/lumen-host/lumen-host-linux-arm64 | cut -d' ' -f1)\" = \"$(shasum -a 256 build/lumen-host/lumen-host-linux-arm64.second | cut -d' ' -f1)\"",
  "LUMEN_TERMUX_PIE_ARTIFACT=\"$(pwd)/build/lumen-host/lumen-host-android-arm64\" go test ./test/contract -run TestTermuxPIEArtifactIsPositionIndependentWhenBuilt -count=1",
  "sh -n deploy/launchd/dev.lumen.host-launcher.sh deploy/termux/run deploy/termux/finish deploy/termux/install-lumen-host && zsh -n scripts/lumen-mac-host scripts/lumen-mac-test scripts/push-termux-host",
  "test -x deploy/launchd/dev.lumen.host-launcher.sh && test -x deploy/termux/run && test -x deploy/termux/finish && test -x deploy/termux/install-lumen-host && test -x scripts/lumen-mac-host && test -x scripts/lumen-mac-test && test -x scripts/push-termux-host",
  "plutil -lint deploy/launchd/dev.lumen.host.plist",
  "if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then docker compose -f deploy/docker/compose.yaml config >/dev/null; else grep -q 'restart: on-failure:3' deploy/docker/compose.yaml && grep -q 'STOPSIGNAL SIGTERM' deploy/docker/Dockerfile; fi",
  "test -n \"${ANDROID_HOME:-}\" && test -d \"$ANDROID_HOME\" || { echo 'Android companion checks require ANDROID_HOME'; exit 1; }",
  "gradle :apps:android-host:testDebugUnitTest :apps:android-host:assembleDebug --no-daemon",
]

[tasks.milestone1-linux-check]
description = "Run the combined Linux setup, recovery, and secret scan journey"
run = [
  "go test ./... -count=1",
  "mkdir -p build/lumen-host",
  "CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o build/lumen-host/lumen-host-linux-amd64 ./cmd/lumen-host",
  "sh -n scripts/lumen-linux-check",
  "test -x scripts/lumen-linux-check",
  "git rev-parse --is-inside-work-tree >/dev/null || { echo 'secret scan requires a Git worktree' >&2; exit 1; }",
  "if git grep -n -I -E '(sk-[A-Za-z0-9]{20,}|Bearer[[:space:]][A-Za-z0-9._-]{20,})' -- . ':!docs'; then echo 'potential credential found' >&2; exit 1; else :; fi",
  "test -f deploy/docker/compose.yaml && docker compose version",
  "scripts/lumen-linux-check",
]

[tasks.milestone1-external-check]
description = "Run the external Hermes adoption and Host-only lifecycle journey"
run = [
  "go test ./test/contract -run TestExternalSetupJourneyScriptContract -count=1",
  "mkdir -p build/lumen-host",
  "CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o build/lumen-host/lumen-host-linux-amd64 ./cmd/lumen-host",
  "sh -n scripts/lumen-external-check",
  "test -x scripts/lumen-external-check",
  "docker compose version",
  "scripts/lumen-external-check",
]
