[tools]
gradle = "9.5.0"
java = "25.0.2"
go = "1.27.1"

[tasks.phase0-check]
description = "Run the Phase 0 cross-platform contract baseline"
run = [
  "gradle -p spikes/o-001/kmp jvmTest --no-daemon",
  "swift run --package-path spikes/o-001/native-schema NativeSchemaSpikeChecker spikes/o-001/fixtures",
]

[tasks.phase2-check]
description = "Run the native Host distribution and companion verification gate"
run = [
  "test -z \"$(gofmt -l cmd internal protocol test)\"",
  "go vet ./...",
  "go test ./...",
  "go test -race ./...",
  "mkdir -p build/lumen-host",
  "go build -trimpath -ldflags='-s -w' -o build/lumen-host/lumen-host ./cmd/lumen-host",
  "GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o build/lumen-host/lumen-host-linux-arm64 ./cmd/lumen-host",
  "sh -n deploy/launchd/dev.lumen.host-launcher.sh deploy/termux/run deploy/termux/finish",
  "chmod +x deploy/launchd/dev.lumen.host-launcher.sh deploy/termux/run deploy/termux/finish",
  "plutil -lint deploy/launchd/dev.lumen.host.plist",
  "if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then docker compose -f deploy/docker/compose.yaml config >/dev/null; else grep -q 'restart: on-failure:3' deploy/docker/compose.yaml && grep -q 'STOPSIGNAL SIGTERM' deploy/docker/Dockerfile; fi",
  "test -n \"${ANDROID_HOME:-}\" && test -d \"$ANDROID_HOME\" || { echo 'Android companion checks require ANDROID_HOME'; exit 1; }",
  "gradle :apps:android-host:testDebugUnitTest :apps:android-host:assembleDebug --no-daemon",
]
