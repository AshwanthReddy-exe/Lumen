services:
  lumen-hermes-init:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.hermes
      args:
        HERMES_COMMIT: ${HERMES_COMMIT:?set pinned Hermes commit}
        HERMES_SOURCE_ARCHIVE_SHA256: ${HERMES_SOURCE_ARCHIVE_SHA256:?set verified Hermes archive SHA-256}
    entrypoint: ["/bin/chown"]
    command: ["65532:65532", "/var/lib/hermes"]
    user: "0:0"
    volumes:
      - lumen-hermes-state:/var/lib/hermes
    restart: "no"
  lumen-hermes:
    depends_on:
      lumen-hermes-init:
        condition: service_completed_successfully
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.hermes
      args:
        HERMES_COMMIT: ${HERMES_COMMIT:?set pinned Hermes commit}
        HERMES_SOURCE_ARCHIVE_SHA256: ${HERMES_SOURCE_ARCHIVE_SHA256:?set verified Hermes archive SHA-256}
    command: ["gateway", "run", "--no-supervise"]
    read_only: true
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_KEY: ${LUMEN_HERMES_API_SERVER_KEY:?set synthetic API server key}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      HERMES_HOME: /var/lib/hermes
    volumes:
      - lumen-hermes-state:/var/lib/hermes
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    user: "65532:65532"
    networks: [lumen-private, lumen-egress]
    ports:
      - "127.0.0.1:${LUMEN_HERMES_HOST_PORT:-28642}:8642"
  lumen-host:
    depends_on:
      lumen-hermes:
        condition: service_started
    network_mode: service:lumen-hermes
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["serve"]
    read_only: true
    environment:
      LUMEN_DATA_DIR: /var/lib/lumen
      LUMEN_OPERATOR_CREDENTIAL_FILE: /var/lib/lumen/operator.credential
      LUMEN_HERMES_BEARER_FILE: /run/secrets/hermes_token
      LUMEN_HERMES_PROFILE: ${LUMEN_HERMES_PROFILE:-hardened}
      LUMEN_HERMES_BASE_URL: ${LUMEN_HERMES_CONTAINER_BASE_URL:-${LUMEN_HERMES_BASE_URL:?set Hermes API server URL}}
      LUMEN_HERMES_CA_FILE: /run/secrets/hermes_ca.pem
      LUMEN_HERMES_CLIENT_CERT_FILE: /run/secrets/hermes_client.crt
      LUMEN_HERMES_CLIENT_KEY_FILE: /run/secrets/hermes_client.key
      LUMEN_HERMES_SERVER_CERT_PIN: ${LUMEN_HERMES_SERVER_CERT_PIN:-REPLACE_WITH_PIN}
    volumes:
      - ${LUMEN_DATA_DIR:?set isolated Lumen data directory}:/var/lib/lumen
      - ${LUMEN_HERMES_TOKEN_SOURCE:?set Hermes bearer secret source}:/run/secrets/hermes_token:ro
      - ${LUMEN_HERMES_CA_SOURCE:?set Hermes CA source}:/run/secrets/hermes_ca.pem:ro
      - ${LUMEN_HERMES_CLIENT_CERT_SOURCE:?set Hermes client certificate source}:/run/secrets/hermes_client.crt:ro
      - ${LUMEN_HERMES_CLIENT_KEY_SOURCE:?set Hermes client key source}:/run/secrets/hermes_client.key:ro
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    user: "${LUMEN_HOST_USER:-65532:65532}"
networks:
  lumen-private:
    internal: true
  lumen-egress: {}
volumes:
  lumen-hermes-state:
