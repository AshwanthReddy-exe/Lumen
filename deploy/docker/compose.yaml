services:
  lumen-hermes-init:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.hermes
      args:
        HERMES_COMMIT: ${HERMES_COMMIT:?set pinned Hermes commit}
        HERMES_SOURCE_ARCHIVE_SHA256: ${HERMES_SOURCE_ARCHIVE_SHA256:?set verified Hermes archive SHA-256}
    environment:
      HERMES_HOME: /var/lib/hermes
    entrypoint: ["/src/.venv/bin/python"]
    command:
      - -c
      - |
        import os
        import stat
        from pathlib import Path

        import yaml
        from hermes_cli.tools_config import _get_platform_tools
        from model_tools import get_tool_definitions

        home = Path("/var/lib/hermes")
        config = home / "config.yaml"
        if config.is_symlink():
            raise SystemExit("managed Hermes config must not be a symlink")
        if config.exists():
            info = config.stat(follow_symlinks=False)
            if not stat.S_ISREG(info.st_mode) or info.st_uid != 65532 or stat.S_IMODE(info.st_mode) & 0o077:
                raise SystemExit("managed Hermes config must be a private Hermes-owned regular file")
            settings = yaml.safe_load(config.read_text(encoding="utf-8")) or {}
            if not isinstance(settings, dict):
                raise SystemExit("managed Hermes config must be a mapping")
            toolsets = (settings.get("platform_toolsets") or {}).get("api_server")
            if toolsets != []:
                raise SystemExit("managed Hermes API toolsets must be explicitly empty")
            title_generation = (settings.get("auxiliary") or {}).get("title_generation")
            if not isinstance(title_generation, dict) or title_generation.get("enabled") is not False:
                raise SystemExit("managed Hermes title generation must be explicitly disabled")
        else:
            settings = {
                "platform_toolsets": {"api_server": []},
                "auxiliary": {"title_generation": {"enabled": False}},
            }
            fd = os.open(config, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
            with os.fdopen(fd, "w", encoding="utf-8") as stream:
                yaml.safe_dump(settings, stream, sort_keys=True)
                stream.flush()
                os.fsync(stream.fileno())
            os.chown(config, 65532, 65532)

        tools = _get_platform_tools(settings, "api_server")
        if tools or get_tool_definitions(enabled_toolsets=tools, quiet_mode=True):
            raise SystemExit("managed Hermes API runtime resolved unexpected model tools")
        home_fd = os.open(home, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
        try:
            os.fchown(home_fd, 65532, 65532)
            try:
                os.mkdir("logs", 0o700, dir_fd=home_fd)
            except FileExistsError:
                pass
            logs_fd = os.open("logs", os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=home_fd)
            try:
                os.fchown(logs_fd, 65532, 65532)
                os.fchmod(logs_fd, 0o700)
                log_fd = os.open("agent.log", os.O_WRONLY | os.O_APPEND | os.O_CREAT | os.O_NOFOLLOW | os.O_NONBLOCK, 0o600, dir_fd=logs_fd)
                try:
                    log_info = os.fstat(log_fd)
                    if not stat.S_ISREG(log_info.st_mode) or log_info.st_nlink != 1:
                        raise SystemExit("managed Hermes agent log must be an unlinked regular file")
                    os.fchown(log_fd, 65532, 65532)
                    os.fchmod(log_fd, 0o600)
                finally:
                    os.close(log_fd)
            finally:
                os.close(logs_fd)
        finally:
            os.close(home_fd)
    user: "0:0"
    volumes:
      - lumen-hermes-state:/var/lib/hermes
    restart: "no"
  lumen-hermes:
    depends_on:
      lumen-hermes-init:
        condition: service_completed_successfully
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.hermes
      args:
        HERMES_COMMIT: ${HERMES_COMMIT:?set pinned Hermes commit}
        HERMES_SOURCE_ARCHIVE_SHA256: ${HERMES_SOURCE_ARCHIVE_SHA256:?set verified Hermes archive SHA-256}
    command: ["gateway", "run", "--no-supervise"]
    read_only: true
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_KEY: ${LUMEN_HERMES_API_SERVER_KEY:?set synthetic API server key}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      HERMES_HOME: /var/lib/hermes
    volumes:
      - lumen-hermes-state:/var/lib/hermes
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    user: "65532:65532"
    networks: [lumen-private, lumen-egress]
    ports:
      - "127.0.0.1:${LUMEN_HERMES_HOST_PORT:-28642}:8642"
  lumen-host:
    depends_on:
      lumen-hermes:
        condition: service_started
    network_mode: service:lumen-hermes
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["serve"]
    read_only: true
    environment:
      LUMEN_DATA_DIR: /var/lib/lumen
      LUMEN_OPERATOR_CREDENTIAL_FILE: /var/lib/lumen/operator.credential
      LUMEN_HERMES_BEARER_FILE: /run/secrets/hermes_token
      LUMEN_HERMES_PROFILE: ${LUMEN_HERMES_PROFILE:-hardened}
      LUMEN_HERMES_BASE_URL: ${LUMEN_HERMES_CONTAINER_BASE_URL:-${LUMEN_HERMES_BASE_URL:?set Hermes API server URL}}
      LUMEN_HERMES_CA_FILE: /run/secrets/hermes_ca.pem
      LUMEN_HERMES_CLIENT_CERT_FILE: /run/secrets/hermes_client.crt
      LUMEN_HERMES_CLIENT_KEY_FILE: /run/secrets/hermes_client.key
      LUMEN_HERMES_SERVER_CERT_PIN: ${LUMEN_HERMES_SERVER_CERT_PIN:-REPLACE_WITH_PIN}
    volumes:
      - ${LUMEN_DATA_DIR:?set isolated Lumen data directory}:/var/lib/lumen
      - ${LUMEN_HERMES_TOKEN_SOURCE:?set Hermes bearer secret source}:/run/secrets/hermes_token:ro
      - ${LUMEN_HERMES_CA_SOURCE:?set Hermes CA source}:/run/secrets/hermes_ca.pem:ro
      - ${LUMEN_HERMES_CLIENT_CERT_SOURCE:?set Hermes client certificate source}:/run/secrets/hermes_client.crt:ro
      - ${LUMEN_HERMES_CLIENT_KEY_SOURCE:?set Hermes client key source}:/run/secrets/hermes_client.key:ro
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    user: "${LUMEN_HOST_USER:-65532:65532}"
networks:
  lumen-private:
    internal: true
  lumen-egress: {}
volumes:
  lumen-hermes-state:
